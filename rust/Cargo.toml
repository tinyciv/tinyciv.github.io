[package]
name = "tinyciv-simulation"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bevy_ecs = { version = "=0.20.1", default-features = false, features = ["std"] }
fixedbitset = "=0.5.9"
rstar = "=0.13.0"
rustc-hash = "=2.1.3"
smallvec = "=1.16.5"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
strip = "debuginfo"
